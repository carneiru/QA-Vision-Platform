apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-secret-provider
  namespace: infrastructure
spec:
  provider: vault
  secretObjects:
  - secretName: vault-test-secret
    type: Opaque
    data:
    - objectName: username
      key: username
    - objectName: password
      key: password
  parameters:
    vaultAddress: "http://vault.infrastructure.svc:8200"
    # Enable Vault agent to handle authentication
    enableSecretRotation: "true"
    # Kubernetes auth
    roleName: "vault-csi-role"
    # Use pod's service account token
    usePodIdentity: "true"
    objects: |
      - objectName: "username"
        secretPath: "secret/data/test"
        secretKey: "username"
      - objectName: "password"
        secretPath: "secret/data/test"
        secretKey: "password"