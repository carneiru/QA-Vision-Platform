[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qeos-collector"
dynamic = ["version"]
description = "Uploads JUnit XML test results from CI to the QEOS platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
qeos-collector = "qeos_collector.cli:main"
# The name before the QEOS rename; prints a deprecation line, then runs the same command
qav-collector = "qeos_collector.cli:main_deprecated"

[tool.setuptools.dynamic]
version = { attr = "qeos_collector.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
