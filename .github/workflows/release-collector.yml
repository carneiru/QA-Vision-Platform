name: Release collector

# Tag collector-vX.Y.Z to release. Publishing to PyPI uses trusted publishing
# (OIDC, no token): configure the publisher once on pypi.org for project
# qav-collector (owner carneiru, repo QA-Vision-Platform, this workflow,
# environment pypi), then set the repository variable PYPI_PUBLISH=true.
# Until that variable exists the publish job is skipped and a tag only
# builds + verifies the artifacts.

on:
  push:
    tags: ["collector-v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/ -q

  build:
    name: Build and verify
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version="$(python -c 'import sys; sys.path.insert(0, "src"); from qav_collector import __version__; print(__version__)')"
          tag="${GITHUB_REF_NAME#collector-v}"
          test "$version" = "$tag" || { echo "tag $tag != __version__ $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Single-file build (zipapp)
        run: |
          python scripts/build_zipapp.py --out dist/qav-collector.pyz
          python dist/qav-collector.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: collector-dist
          path: collector/dist/

  release:
    name: GitHub Release with the artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: collector-dist
          path: dist/
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  docker:
    name: Docker image to GHCR
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, verify, push
        run: |
          version="${GITHUB_REF_NAME#collector-v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/qav-collector"
          docker build collector -t "$image:$version" -t "$image:latest"
          docker run --rm "$image:$version" --version
          docker push "$image:$version"
          docker push "$image:latest"

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: collector-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
