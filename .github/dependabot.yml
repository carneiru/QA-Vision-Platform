version: 2
updates:
  # Python: each service pins its own requirements.txt; shared and the collector use pyproject.toml.
  # The repository root holds no Python manifest, which is why "/" alone failed ("No files found in /").
  - package-ecosystem: "pip"
    directories:
      - "/platforms/auth-service/auth-service"
      - "/platforms/organization-service"
      - "/platforms/project-service"
      - "/platforms/ingestion-service"
      - "/platforms/test-management-service"
      - "/shared"
      - "/collector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    ignore:
      # SQLAlchemy 2.1 makes postgresql:// default to psycopg 3; the services use psycopg2.
      # Stay on 2.0.x until a planned migration (TODO.md).
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
      # bcrypt 5 breaks passlib (auth-service): hashing raises "password cannot be longer than 72 bytes"
      - dependency-name: "bcrypt"
        versions: [">=5"]
    groups:
      # One PR for every minor/patch bump across all Python directories
      python-minor-patch:
        update-types: ["minor", "patch"]
      # Major bumps: one PR per dependency, covering every directory that uses it
      python-major:
        update-types: ["major"]
        group-by: dependency-name

  # Dashboard (npm)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The test/build toolchain moves together (Vite 6+ for msw 3 and vitest 3+; typescript-eslint
      # does not support TypeScript 7 yet). Planned as one upgrade (TODO.md), not piecemeal PRs.
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "msw"
        versions: [">=3"]
      - dependency-name: "vitest"
        versions: [">=3"]
      - dependency-name: "vite"
        versions: [">=6"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
