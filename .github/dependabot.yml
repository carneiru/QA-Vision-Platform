version: 2
updates:
  # Python: each service pins its own requirements.txt; shared and the collector use pyproject.toml.
  # The repository root holds no Python manifest, which is why "/" alone failed ("No files found in /").
  - package-ecosystem: "pip"
    directories:
      - "/platforms/auth-service/auth-service"
      - "/platforms/organization-service"
      - "/platforms/project-service"
      - "/platforms/ingestion-service"
      - "/platforms/test-management-service"
      - "/shared"
      - "/collector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    pull-request-branch-name:
      separator: "-"

  # Dashboard (npm)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
