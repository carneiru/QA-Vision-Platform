[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_(slug).py

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `python-dateutil` to requirements.txt
# timezone = America/Los_Angeles

# max length of characters to apply to the
# "version" field of autoname generation
# value can be set to the length of the application's __version__
# if set to the empty string, no truncation will occur
# version_path = %(version)s

# line separators in generated migration files
# os_line_sep only works if os_line_sep = 'os'
# defaults to \n (newline)
# os_line_sep = os

# Output file encoding for revision files.
# Defaults to utf-8
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers =
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
#format = %(levelname)-5.5s [%(name)s] %(asctime)s %(message)s