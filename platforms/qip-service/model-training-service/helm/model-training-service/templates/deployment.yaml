apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-training-service.fullname" . }}
  labels:
    {{- include "model-training-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "model-training-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "model-training-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "model-training-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.username }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: REDIS_URL
              value: "redis://{{ .values.redis.host }}:{{ .values.redis.port }}/0"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Values.kafka.bootstrapServers }}"
            - name: HTTP_CLIENT_TIMEOUT
              value: "{{ .Values.httpClient.timeout }}"
            - name: HTTP_CLIENT_MAX_RETRIES
              value: "{{ .Values.httpClient.maxRetries }}"
            - name: HTTP_CLIENT_BACKOFF_FACTOR
              value: "{{ .Values.httpClient.backoffFactor }}"
            - name: HTTP_CIRCUIT_BREAKER_FAILURE_THRESHOLD
              value: "{{ .Values.httpClient.circuitBreakerFailureThreshold }}"
            - name: HTTP_CIRCUIT_BREAKER_RECOVERY_TIMEOUT
              value: "{{ .Values.httpClient.circuitBreakerRecoveryTimeout }}"
            - name: JAEGER_AGENT_HOST
              value: "{{ .Values.jaeger.host }}"
            - name: JAEGER_AGENT_PORT
              value: "{{ .Values.jaeger.port }}"
            - name: JAEGER_SAMPLER_TYPE
              value: "{{ .Values.jaeger.samplerType }}"
            - name: JAEGER_SAMPLER_PARAM
              value: "{{ .Values.jaeger.samplerParam }}"
          resources:
            {{- toYaml .Values.resources | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
