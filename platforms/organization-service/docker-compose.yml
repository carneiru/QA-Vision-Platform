services:
  organization-service:
    # Context is the repo root so the image can COPY shared/ alongside this service.
    build:
      context: ../..
      dockerfile: platforms/organization-service/Dockerfile
    # auth-service's own docker-compose already publishes host port 8000, so this service
    # is published on 8001 to avoid the collision when both stacks run side by side.
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/organization_db
      # No fallback, and it must equal auth-service's SECRET_KEY so its JWTs verify here.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY (same value as auth-service)}
      - ALGORITHM=HS256
      # auth-service runs in its own compose stack; override this to wherever it is actually
      # reachable (a shared external network, or host.docker.internal:8000 on Docker Desktop)
      - AUTH_SERVICE_URL=http://auth-service:8000
      - INTERNAL_API_PASSWORD=
    depends_on:
      db:
        condition: service_healthy
    # Lets `docker compose up --wait` (and CI's smoke test) block until the app actually
    # serves requests. The slim image has no curl, so probe with Python's stdlib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: organization_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d organization_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # auth-service's compose publishes 5433, so use 5434 here
      - "5434:5432"

volumes:
  postgres_data:
