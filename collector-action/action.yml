name: QA Vision collector
description: >-
  Parse JUnit XML test reports and upload them as one run to a QA Vision
  platform. Provide the project API key as the QAV_API_KEY environment
  variable on the step - never as an input, so it stays out of the action log.

inputs:
  url:
    description: Platform URL (e.g. https://qa-vision.example.com)
    required: true
  patterns:
    description: JUnit XML glob patterns, space separated (** matches directories)
    required: true
  environment:
    description: Environment label stored on the run (e.g. staging)
    required: false
    default: ""
  extra-args:
    description: Extra qav-collector flags (e.g. --fail-on-error --no-changes)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install qav-collector (pinned to this action's ref)
      shell: bash
      run: |
        python -m pip install --quiet \
          "qav-collector @ git+https://github.com/${GITHUB_ACTION_REPOSITORY}@${GITHUB_ACTION_REF}#subdirectory=collector"
    - name: Upload test results
      shell: bash
      run: |
        qav-collector upload ${{ inputs.patterns }} \
          --url "${{ inputs.url }}" \
          ${{ inputs.environment && format('--environment "{0}"', inputs.environment) || '' }} \
          ${{ inputs.extra-args }}
