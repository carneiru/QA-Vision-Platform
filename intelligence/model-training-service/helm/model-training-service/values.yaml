# Default values for model-training-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: model-training-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
database:
  host: postgres
  port: 5432
  name: model_training
  username: postgres
  password: postgres

# Redis configuration
redis:
  host: redis
  port: 6379
  password: ""

# Kafka configuration
kafka:
  bootstrapServers: kafka:9092

# Service configuration
service:
  title: Model Training Service
  description: Service for training and managing ML models
  version: 1.0.0