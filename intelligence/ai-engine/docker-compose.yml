version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: ai_engine
      POSTGRES_USER: ai_engine_user
      POSTGRES_PASSWORD: ai_engine_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-preparation:
    build: ./services/data_preparation
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ai_engine_user:ai_engine_pass@postgres:5432/ai_engine
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/data_preparation:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  feature-store:
    build: ./services/feature_store
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ai_engine_user:ai_engine_pass@postgres:5432/ai_engine
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/feature_store:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: