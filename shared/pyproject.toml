[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qeos-shared"
version = "0.1.0"
description = "Shared configuration and database wiring for QEOS services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0,<2.1",
]

# Declared explicitly rather than left to auto-discovery: with tests/ sitting beside
# qeos_shared/, setuptools' flat-layout discovery errors out rather than guessing.
[tool.setuptools]
packages = ["qeos_shared"]
