# Azure Pipelines step template: upload test results to a QA Vision platform.
#
# Copy this file into your repository (or reference it through a repository resource), then
# after your test step:
#
#   steps:
#     - template: templates/qav-collector.azure-pipelines.yml
#       parameters:
#         url: https://qav.example.com
#         patterns: "reports/**/*.xml"
#
# Add QAV_API_KEY to the pipeline as a secret variable. Azure Pipelines never gives secret
# variables to scripts on its own; the env mapping below is what passes it to the collector.

parameters:
  - name: url
    type: string
  - name: patterns
    type: string
    default: "reports/**/*.xml"
  - name: environment
    type: string
    default: ""
  - name: ref
    type: string
    default: collector-v0.2.0
  # Reporting is a side effect: by default a failed upload does not fail the pipeline
  - name: failOnError
    type: boolean
    default: false

steps:
  - task: UsePythonVersion@0
    displayName: Python for qav-collector
    condition: always()
    inputs:
      versionSpec: "3.x"

  - script: |
      python -m pip install --quiet --disable-pip-version-check "qav-collector @ git+https://github.com/carneiru/QA-Vision-Platform@${{ parameters.ref }}#subdirectory=collector"
      qav-collector upload "${{ parameters.patterns }}"
    displayName: Upload test results to QA Vision
    condition: always()  # report results even when the tests failed
    continueOnError: ${{ not(parameters.failOnError) }}
    env:
      QAV_URL: ${{ parameters.url }}
      QAV_API_KEY: $(QAV_API_KEY)
      ${{ if ne(parameters.environment, '') }}:
        QAV_ENVIRONMENT: ${{ parameters.environment }}
